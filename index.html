<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaCode - Code Renderer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body class="bg-slate-900 h-screen flex text-slate-200 overflow-hidden relative">
    <div id="recordingIndicator" role="status" aria-live="polite" class="fixed top-4 right-4 z-50 items-center gap-2 bg-red-600/90 text-white px-3 py-1.5 rounded-full font-bold text-xs animate-pulse hidden">
        <div class="w-2 h-2 rounded-full bg-white"></div>
        <span data-i18n="recording">REC 렌더링 중...</span>
    </div>

    <div id="toastContainer"></div>

    <aside id="sidebar" style="width: 320px; min-width: 250px; max-width: 50vw;" class="flex flex-col z-20 flex-shrink-0 absolute lg:relative h-full transition-transform duration-300 -translate-x-full lg:translate-x-0">
        <div class="p-6 flex-1 flex flex-col gap-5 h-full">
            <div class="mb-2 flex items-center justify-between gap-2">
                <h1 class="text-xl font-bold text-white flex items-center gap-3">
                    <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M11.182.008C11.148-.03 9.923.023 8.857 1.18c-1.066 1.156-.902 2.482-.878 2.516s1.52.087 2.475-1.258.762-2.391.728-2.43m3.314 11.733c-.048-.096-2.325-1.234-2.113-3.422s1.675-2.789 1.698-2.854-.597-.79-1.254-1.157a3.7 3.7 0 0 0-1.563-.434c-.108-.003-.483-.095-1.254.116-.508.139-1.653.589-1.968.607-.316.018-1.256-.522-2.267-.665-.647-.125-1.333.131-1.824.328-.49.196-1.422.754-2.074 2.237-.652 1.482-.311 3.83-.067 4.56s.625 1.924 1.273 2.796c.576.984 1.34 1.667 1.659 1.899s1.219.386 1.843.067c.502-.308 1.408-.485 1.766-.472.357.013 1.061.154 1.782.539.571.197 1.111.115 1.652-.105.541-.221 1.324-1.059 2.238-2.758q.52-1.185.473-1.282"/>
                    </svg>
                    MaCode
                </h1>
                <button id="langToggle" data-i18n-aria="langToggleAria" class="text-xs font-semibold px-2.5 py-1 rounded-md bg-slate-700/60 hover:bg-slate-600 text-slate-200 transition flex-shrink-0">EN</button>
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-semibold text-slate-300" data-i18n="fileName">파일 이름</label>
                <input type="text" id="fileNameInput" value="sieve-of-eratosthenes.py" class="w-full p-1.5 bg-slate-900 border border-slate-700 rounded-md font-mono text-xs text-slate-300 focus:outline-none focus:border-blue-500">
            </div>

            <div class="flex flex-col gap-1.5 flex-1 min-h-0">
                <label class="text-xs font-semibold text-slate-300" data-i18n="sourceCode">소스 코드</label>
                <textarea id="codeInput" class="w-full h-full p-2 bg-slate-900 border border-slate-700 rounded-md font-mono text-xs text-slate-300 resize-none focus:outline-none focus:border-blue-500 flex-1 overflow-y-auto" spellcheck="false"></textarea>
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-semibold text-slate-300" data-i18n="language">언어 선택</label>
                <select id="languageSelect" class="w-full p-1.5 bg-slate-900 border border-slate-700 rounded-md text-xs text-slate-300 focus:outline-none focus:border-blue-500"></select>
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-semibold text-slate-300" data-i18n="theme">테마</label>
                <select id="themeSelect" class="w-full p-1.5 bg-slate-900 border border-slate-700 rounded-md text-xs text-slate-300 focus:outline-none focus:border-blue-500"></select>
            </div>

            <div class="flex flex-col gap-1.5">
                <div class="flex justify-between items-center">
                    <label class="text-xs font-semibold text-slate-300" data-i18n="typingSpeed">타이핑 속도</label>
                    <span id="speedValue" class="text-xs text-blue-400 font-mono">4 - 빠름</span>
                </div>
                <input type="range" id="speedInput" min="1" max="5" value="4" step="1" class="w-full accent-blue-500 h-1.5">
            </div>

            <div class="flex items-center gap-2">
                <input type="checkbox" id="aiMode" checked class="w-3.5 h-3.5 rounded bg-slate-900 border-slate-700 text-blue-500 focus:ring-blue-500 focus:ring-offset-slate-800">
                <label for="aiMode" class="text-xs font-semibold text-slate-300 select-none cursor-pointer" data-i18n="aiChunk">AI 청크 모드 (단어 단위 출력)</label>
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-semibold text-slate-300" data-i18n="recordMode">녹화 방식</label>
                <select id="recordModeSelect" class="w-full p-1.5 bg-slate-900 border border-slate-700 rounded-md text-xs text-slate-300 focus:outline-none focus:border-blue-500"></select>
            </div>

            <div class="mt-1 flex flex-col gap-2">
                <button id="previewBtn" class="w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-md font-semibold transition text-xs flex items-center justify-center gap-2">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path></svg>
                    <span data-i18n="preview">미리보기 (재설정)</span>
                </button>
                <button id="startBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-md font-bold shadow-lg shadow-blue-500/30 transition text-xs flex items-center justify-center gap-2">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    <span data-i18n="startRender">렌더링 시작 (전체화면)</span>
                </button>
                <p id="recordUnsupportedNote" class="hidden text-[11px] leading-snug text-amber-400/90" data-i18n="recordUnsupported">이 브라우저는 영상 녹화(MediaRecorder)를 지원하지 않습니다. 미리보기는 사용할 수 있습니다.</p>
            </div>
        </div>
    </aside>

    <div id="resizer" class="w-1.5 bg-slate-800 border-r border-slate-700 cursor-col-resize z-30 hidden lg:block hover:bg-blue-500 transition-colors flex-shrink-0"></div>

    <button id="toggleSidebar" aria-label="컨트롤 패널 열기/닫기" data-i18n-aria="toggleSidebar" class="absolute top-4 left-4 z-40 p-2 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition backdrop-blur-sm shadow-md lg:hidden">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
    </button>

    <main id="mainArea" class="flex-1 presentation-bg flex items-center justify-center p-8 lg:p-20 relative h-full overflow-hidden">
        <div id="macWindow" class="w-full max-w-4xl shadow-2xl rounded-xl overflow-hidden border" style="background-color: var(--mac-bg); border-color: var(--mac-border); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);">
            <div class="h-10 flex items-center px-4" style="background-color: var(--mac-titlebar);">
                <div class="flex gap-2">
                    <div class="w-3 h-3 rounded-full bg-red-500"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500"></div>
                </div>
                <div id="windowTitle" class="flex-1 text-center font-mono text-xs text-slate-400 select-none">
                    sieve-of-eratosthenes.py
                </div>
            </div>
            <div class="p-6 h-[60vh] min-h-[400px] overflow-y-auto relative font-mono text-sm sm:text-base leading-relaxed" id="codeDisplay"><span id="outputBox"></span><span class="cursor-block" id="cursor"></span></div>
        </div>

        <canvas id="renderCanvas" class="hidden w-full max-w-4xl rounded-xl shadow-2xl"></canvas>
    </main>

    <script src="js/i18n.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/canvasRenderer.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
